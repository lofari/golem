name: test-agent
description: "Test agent"
initial-state: [goal]

config:
  lint-cmd: null
  test-cmd: null
  ci-enabled: false

steps:
  - git-setup:
      type: builtin

  - plan:
      type: agentic
      reads: [goal]
      writes: [plan]
      tools: [semantic_search]

  - implement:
      type: agentic
      reads: [goal, plan]
      optional-reads: [lint-results, test-results]
      writes: [code, test-results]

  - lint:
      type: builtin
      reads: [code]
      writes: [lint-results]

  - run-tests:
      type: builtin
      reads: [code]
      writes: [test-results]

  - create-pr:
      type: builtin
      reads: [code, goal]
      optional-reads: [plan, test-results, lint-results]
      writes: [pr-result]

errors:
  transient: { action: retry, max: 3 }
  malformed-output: { action: re-run, max: 2, hint: "Write session-output.json with required keys." }
  contract-violation: { action: halt }
